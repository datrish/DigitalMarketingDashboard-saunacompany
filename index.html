<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sauna Company Marketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #f6f3ee; --card: #ffffff; --ink: #1f2225; --muted: #6b6f73; --line: #e4ded4; --soft: #f1ece4;
  --timber: #a8652f; --timber-soft: #f6e9dc;
  --good: #2f7d4f; --good-bg: #e3f2e8; --bad: #b4412f; --bad-bg: #fbe6e1; --warn: #9a6a00; --warn-bg: #fdf1d4;
  --blue: #2f5f8a; --blue-bg: #e2edf7;
  --u: #b4412f; --h: #9a6a00; --m: #2f5f8a;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #16181a; --card: #1f2225; --ink: #ece8e2; --muted: #a2a6aa; --line: #33373b; --soft: #272a2e;
  --timber: #d08a4f; --timber-soft: #3a2a1d; --good: #6cc48f; --good-bg: #1f3428; --bad: #f08a76; --bad-bg: #3d231e;
  --warn: #e6b84a; --warn-bg: #3a3018; --blue: #82b4e0; --blue-bg: #1d2c3b; --u: #f08a76; --h: #e6b84a; --m: #82b4e0; } }
:root[data-theme="dark"] {
  --bg: #16181a; --card: #1f2225; --ink: #ece8e2; --muted: #a2a6aa; --line: #33373b; --soft: #272a2e;
  --timber: #d08a4f; --timber-soft: #3a2a1d; --good: #6cc48f; --good-bg: #1f3428; --bad: #f08a76; --bad-bg: #3d231e;
  --warn: #e6b84a; --warn-bg: #3a3018; --blue: #82b4e0; --blue-bg: #1d2c3b; --u: #f08a76; --h: #e6b84a; --m: #82b4e0; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 "IBM Plex Sans", system-ui, sans-serif; }
h1, h2, h3 { font-family: "Bricolage Grotesque", system-ui, sans-serif; margin: 0; letter-spacing: -0.01em; }
a { color: var(--timber); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px 60px; }
header.top { padding: 22px 0 12px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: end; justify-content: space-between; }
header.top h1 { font-size: 26px; }
.sub { color: var(--muted); font-size: 13px; }
nav.jump { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); margin: 0 -16px 18px; padding: 8px 16px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
nav.jump a { white-space: nowrap; text-decoration: none; color: var(--ink); font-size: 13px; padding: 5px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); }
nav.jump a:hover { border-color: var(--timber); }
section.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; scroll-margin-top: 56px; }
.card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px; margin-bottom: 12px; }
.card-head h2 { font-size: 19px; }
.note { color: var(--muted); font-size: 12.5px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 10px; }
.kpi { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--card); }
.kpi.alert { border-color: var(--bad); background: var(--bad-bg); }
.kpi .lbl { font-size: 12.5px; color: var(--muted); }
.kpi .big { font: 600 26px/1.15 "Bricolage Grotesque", sans-serif; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
.kpi .delta { font-size: 12px; display: flex; flex-wrap: wrap; gap: 2px 10px; }
.up { color: var(--good); } .down { color: var(--bad); }
.summary { display: grid; gap: 8px; margin-top: 14px; }
.summary div { padding: 10px 12px; border-left: 3px solid var(--timber); background: var(--soft); border-radius: 0 8px 8px 0; font-size: 14px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.url { font-family: "IBM Plex Mono", monospace; font-size: 12px; word-break: break-all; min-width: 200px; }
.pill { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.p-Urgent { background: var(--bad-bg); color: var(--u); } .p-High { background: var(--warn-bg); color: var(--h); } .p-Medium { background: var(--blue-bg); color: var(--m); }
.s-todo { background: var(--soft); color: var(--muted); } .s-doing { background: var(--warn-bg); color: var(--warn); } .s-done { background: var(--good-bg); color: var(--good); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.filters button { font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
.filters button.on { background: var(--ink); color: var(--card); border-color: var(--ink); }
.task { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; background: var(--card); }
.task summary { list-style: none; cursor: pointer; padding: 12px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; }
.task summary::-webkit-details-marker { display: none; }
.task .tid { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted); }
.task .ttl { font-weight: 600; }
.task .meta { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted); }
.task .body { padding: 0 14px 14px 14px; border-top: 1px dashed var(--line); }
.task .why { margin: 10px 0; font-size: 14px; }
.task ol { margin: 6px 0 0; padding-left: 20px; font-size: 14px; }
.task ol li { margin-bottom: 4px; }
.task[open] { border-color: var(--timber); }
.chart { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }
.bar { display: inline-block; height: 8px; border-radius: 4px; background: var(--timber); vertical-align: middle; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 14px; margin: 0; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; }
.bad { color: var(--bad); font-weight: 600; }
ul.plain { margin: 0; padding-left: 18px; font-size: 14px; } ul.plain li { margin-bottom: 5px; }
.links { display: flex; flex-wrap: wrap; gap: 6px; }
.links a { font-size: 12.5px; text-decoration: none; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); }
.routine { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 10px; }
.routine div { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; }
.routine b { display: block; font-family: "Bricolage Grotesque", sans-serif; font-size: 15px; margin-bottom: 4px; }
.err { padding: 20px; color: var(--bad); }
@media (max-width: 560px) { header.top h1 { font-size: 22px; } .kpi .big { font-size: 22px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Sauna Company · Digital Marketing</h1>
      <div class="sub" id="updated">Loading…</div>
    </div>
    <div class="links" id="toplinks"></div>
  </header>
  <nav class="jump" aria-label="Sections">
    <a href="#overview">Overview</a><a href="#routine">Daily</a><a href="#tasks">Tasks</a><a href="#search">Search</a><a href="#pages">Pages</a>
    <a href="#keywords">Keywords</a><a href="#competitors">Competitors</a><a href="#local">Google local</a>
    <a href="#content">Blog</a><a href="#social">Social</a><a href="#technical">Technical</a>
  </nav>
  <main id="app"></main>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const n0 = (v) => (v == null ? '–' : Number(v).toLocaleString('en-GB'));
const pctChange = (a, b) => (b ? Math.round(((a - b) / b) * 100) : null);
const arrow = (d, good) => (d == null ? '' : `<span class="${(d >= 0) === (good !== 'down') ? 'up' : 'down'}">${d >= 0 ? '▲' : '▼'} ${Math.abs(d)}%</span>`);
const STATUS = { 'To do': 's-todo', 'In progress': 's-doing', 'Done': 's-done' };

fetch('data.json', { cache: 'no-store' }).then((r) => r.json()).then(render).catch((e) => { $('#app').innerHTML = `<div class="err">Could not load data.json (${esc(e.message)}).</div>`; });

function render(d) {
  window.__SHEET__ = d.meta.taskSheet;
  $('#updated').textContent = `Data snapshot ${new Date(d.meta.updated).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })} · ${d.meta.site}`;
  $('#toplinks').innerHTML = Object.entries(d.meta.links).map(([k, v]) => `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(k)}</a>`).join('');
  const urgent = d.tasks.filter((t) => t.priority === 'Urgent' && t.status !== 'Done').length;
  $('#app').innerHTML = [overview(d, urgent), routine(), tasks(d), search(d), pagesSec(d), keywords(d), comps(d), local(d), content(d), social(d), technical(d)].join('');
  wireFilters(d);
}

function overview(d, urgent) {
  const tiles = d.kpis.map((k) => {
    const val = k.fmt === 'int' ? n0(k.value) : k.fmt === 'pct' ? k.value.toFixed(2) + '%' : esc(k.value);
    const deltas = [];
    if (k.prev != null) deltas.push(`${arrow(pctChange(k.value, k.prev), k.good)} vs previous 28 days`);
    if (k.yoy != null) deltas.push(`${arrow(pctChange(k.value, k.yoy), k.good)} vs last year`);
    return `<div class="kpi${k.alert ? ' alert' : ''}"><div class="lbl">${esc(k.label)}</div><div class="big">${val}</div><div class="delta">${deltas.join('<br>') || `<span class="note">${esc(k.note)}</span>`}</div>${deltas.length ? `<div class="note">${esc(k.note)}</div>` : ''}</div>`;
  }).join('');
  return `<section class="card" id="overview"><div class="card-head"><h2>Where we stand</h2><span class="note">Search data: ${esc(d.meta.gscWindow)}</span></div>
  <div class="kpis">${tiles}</div>
  <div class="summary">
    <div><b>Search:</b> impressions are up 12% on last month and 24% on last year, but clicks are flat. Pages are being shown, but titles aren't earning the click, and the main sales page (/sauna-installation) ranks 29th.</div>
    <div><b>Google local:</b> we appear 4th in the map for "sauna installation", but with 3 reviews against 52–166 for the businesses around us. Reviews are the fastest win.</div>
    <div><b>Content:</b> 27 blog posts, but several repeat each other and split their rankings. Big searches like "outdoor sauna" (9,900/month) and "garden sauna" (4,400) have weak pages; "basement sauna" and "commercial sauna" have none.</div>
    <div><b>This week:</b> ${urgent} urgent tasks below. Start with reviews, Google Business Profile, tracking and the installation page.</div>
  </div></section>`;
}

function tasks(d) {
  const areas = [...new Set(d.tasks.map((t) => t.area))];
  const cards = d.tasks.map((t) => `<details class="task" data-p="${esc(t.priority)}" data-a="${esc(t.area)}">
    <summary><span class="tid">${esc(t.id)}</span><span class="ttl">${esc(t.title)}</span><span class="pill p-${esc(t.priority)}">${esc(t.priority)}</span>
      <span class="meta"><span>${esc(t.area)}</span>·<span>Owner: ${esc(t.owner)}</span>·<span>Effort ${esc(t.effort)}</span>·<span>Impact ${esc(t.impact)}</span>·<span class="pill ${STATUS[t.status] || 's-todo'}">${esc(t.status)}</span></span></summary>
    <div class="body"><p class="why"><b>Why:</b> ${esc(t.why)}</p><b>How:</b><ol>${t.steps.map((s) => `<li>${esc(s)}</li>`).join('')}</ol></div></details>`).join('');
  return `<section class="card" id="tasks"><div class="card-head"><h2>Do this: prioritised task list</h2><span class="note">Tap a task for the why and the steps. Effort S = under 2 h, M = half a day to 2 days, L = a week+.</span></div>
  <div class="filters" id="filters"><button class="on" data-f="all">All (${d.tasks.length})</button>${['Urgent', 'High', 'Medium'].map((p) => `<button data-f="p:${p}">${p} (${d.tasks.filter((t) => t.priority === p).length})</button>`).join('')}${areas.map((a) => `<button data-f="a:${esc(a)}">${esc(a)}</button>`).join('')}</div>
  <div id="tasklist">${cards}</div></section>`;
}
function wireFilters() {
  document.querySelectorAll('#filters button').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('#filters button').forEach((x) => x.classList.toggle('on', x === b));
    const f = b.dataset.f;
    document.querySelectorAll('#tasklist .task').forEach((t) => {
      t.hidden = !(f === 'all' || (f.startsWith('p:') && t.dataset.p === f.slice(2)) || (f.startsWith('a:') && t.dataset.a === f.slice(2)));
    });
  }));
}

function chart(monthly) {
  const W = 760, H = 240, pad = { l: 44, r: 44, t: 14, b: 28 };
  const cw = (W - pad.l - pad.r) / monthly.length;
  const maxC = Math.max(...monthly.map((m) => m[1])) * 1.15, maxI = Math.max(...monthly.map((m) => m[2])) * 1.15;
  const y = (v, m) => pad.t + (H - pad.t - pad.b) * (1 - v / m);
  const bars = monthly.map((m, i) => `<rect x="${pad.l + i * cw + cw * 0.2}" y="${y(m[1], maxC)}" width="${cw * 0.6}" height="${H - pad.b - y(m[1], maxC)}" rx="3" fill="var(--timber)"><title>${m[0]}: ${n0(m[1])} clicks</title></rect>
    <text x="${pad.l + i * cw + cw / 2}" y="${H - 9}" font-size="11" text-anchor="middle" fill="var(--muted)">${m[0].split(' ')[0]}</text>`).join('');
  const line = monthly.map((m, i) => `${i ? 'L' : 'M'}${pad.l + i * cw + cw / 2},${y(m[2], maxI)}`).join(' ');
  const dots = monthly.map((m, i) => `<circle cx="${pad.l + i * cw + cw / 2}" cy="${y(m[2], maxI)}" r="3.5" fill="var(--blue)"><title>${m[0]}: ${n0(m[2])} impressions</title></circle>`).join('');
  const ticks = [0, 0.5, 1].map((f) => `<text x="${pad.l - 6}" y="${y(maxC * f / 1.15, maxC) + 4}" font-size="11" text-anchor="end" fill="var(--muted)">${Math.round(maxC * f / 1.15)}</text>
    <text x="${W - pad.r + 6}" y="${y(maxI * f / 1.15, maxI) + 4}" font-size="11" fill="var(--muted)">${Math.round(maxI * f / 1.15 / 1000)}k</text>
    <line x1="${pad.l}" x2="${W - pad.r}" y1="${y(maxC * f / 1.15, maxC)}" y2="${y(maxC * f / 1.15, maxC)}" stroke="var(--line)"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly Google clicks and impressions">${ticks}${bars}<path d="${line}" fill="none" stroke="var(--blue)" stroke-width="2.5"/>${dots}</svg>
  <div class="legend"><span><i style="background:var(--timber)"></i>Clicks (left)</span><span><i style="background:var(--blue)"></i>Impressions (right)</span></div>`;
}

function search(d) {
  const q = d.queries.map((r) => `<tr><td>${esc(r[0])}</td><td class="num">${n0(r[1])}</td><td class="num">${n0(r[2])}</td><td class="num">${r[3].toFixed(1)}</td></tr>`).join('');
  const s = d.striking.map((r) => `<tr><td>${esc(r[0])}</td><td class="num">${n0(r[1])}</td><td class="num">${r[2].toFixed(1)}</td><td class="url">${esc(r[3])}</td></tr>`).join('');
  return `<section class="card" id="search"><div class="card-head"><h2>Google search: 12 months</h2><span class="note">Search Console, all devices</span></div>${chart(d.monthly)}
  <div class="two" style="margin-top:16px">
    <div><h3 style="font-size:16px;margin-bottom:8px">Top searches (last 3 months)</h3><div class="tablewrap"><table><thead><tr><th>Search</th><th class="num">Clicks</th><th class="num">Impr.</th><th class="num">Pos.</th></tr></thead><tbody>${q}</tbody></table></div></div>
    <div><h3 style="font-size:16px;margin-bottom:8px">Close to page 1: quick wins</h3><p class="note" style="margin:0 0 6px">Ranking 5–30 with real demand. A better title, H2 and internal links can move these. See T17.</p><div class="tablewrap"><table><thead><tr><th>Search</th><th class="num">Impr.</th><th class="num">Pos.</th><th>Page to improve</th></tr></thead><tbody>${s}</tbody></table></div></div>
  </div></section>`;
}

function pagesSec(d) {
  const rows = d.pages.map((r) => `<tr><td class="url">${esc(r[0])}</td><td class="num">${n0(r[1])}</td><td class="num">${n0(r[2])}</td><td class="num${r[3] < 1 ? ' bad' : ''}">${r[3].toFixed(2)}%</td><td class="num${r[4] > 20 ? ' bad' : ''}">${r[4].toFixed(1)}</td><td>${esc(r[5])}</td></tr>`).join('');
  return `<section class="card" id="pages"><div class="card-head"><h2>Pages that need work</h2><span class="note">Last 3 months · red = CTR under 1% or position worse than 20</span></div>
  <div class="tablewrap"><table><thead><tr><th>Page</th><th class="num">Clicks</th><th class="num">Impr.</th><th class="num">CTR</th><th class="num">Pos.</th><th>What to do</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

function keywords(d) {
  const max = Math.max(...d.gaps.map((g) => g[1]));
  const rows = d.gaps.map((g) => `<tr><td>${esc(g[0])}</td><td class="num">${n0(g[1])} <span class="bar" style="width:${Math.max(3, Math.round((g[1] / max) * 70))}px"></span></td><td class="num">${g[2] ?? '–'}</td><td class="num${g[3] == null || g[3] > 20 ? ' bad' : ''}">${g[3] == null ? 'not ranking' : g[3]}</td><td>${esc(g[4])}</td></tr>`).join('');
  return `<section class="card" id="keywords"><div class="card-head"><h2>Keyword gaps: what buyers search that we miss</h2><span class="note">UK monthly searches · difficulty 0–100 (lower = easier) · our current position</span></div>
  <div class="tablewrap"><table><thead><tr><th>Keyword</th><th class="num">Searches/mo</th><th class="num">Difficulty</th><th class="num">Our pos.</th><th>Action</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="note" style="margin-top:8px">Our judgement: most of these have very low difficulty, so a strong page with real case studies has a good chance of reaching page 1.</p></section>`;
}

function comps(d) {
  const rows = d.competitors.map((c) => `<tr><td><a href="https://${esc(c[0])}" target="_blank" rel="noopener">${esc(c[0])}</a></td><td class="num">${c[1] ?? '–'}</td><td class="num">${c[2] ?? '–'}</td><td class="num">${c[3] ? c[3] + '★' : '–'}</td><td class="num">${c[4] ?? '–'}</td><td>${esc(c[5])}</td></tr>`).join('');
  return `<section class="card" id="competitors"><div class="card-head"><h2>Competitors</h2><span class="note">Who ranks for our 20 core keywords (sauna installation, bespoke sauna, outdoor/garden/home sauna, steam room…)</span></div>
  <div class="tablewrap"><table><thead><tr><th>Competitor</th><th class="num">Visibility</th><th class="num">Keywords</th><th class="num">Google rating</th><th class="num">Reviews</th><th>Where they beat us</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="note" style="margin-top:8px">Our edge to push in copy: fully bespoke, designed on site, ventilation/CO₂ expertise, case studies in small and awkward spaces. Polhus, Supersauna and Finnmark mainly sell products, cabins and kits.</p></section>`;
}

function local(d) {
  const p = d.local.profile;
  const ranks = d.local.ranks.map((r) => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td class="num"><b>${esc(r[2])}</b></td><td>${esc(r[3])}</td></tr>`).join('');
  return `<section class="card" id="local"><div class="card-head"><h2>Google local (Business Profile)</h2><span class="note">Live profile data, 6 Nov 2026</span></div>
  <div class="two"><dl class="facts">
    <dt>Rating</dt><dd class="bad">${p.rating}★ from ${p.reviews} reviews (${esc(p.ratingSplit)})</dd>
    <dt>Category</dt><dd>${esc(p.category)} · <span class="bad">no extra categories</span></dd>
    <dt>Services</dt><dd class="bad">${esc(p.services)}</dd><dt>Booking</dt><dd class="bad">${esc(p.booking)}</dd>
    <dt>Photos</dt><dd>${p.photos}</dd><dt>Hours</dt><dd>${esc(p.hours)}</dd><dt>Address</dt><dd>${esc(p.address)}</dd>
    <dt>Metricool</dt><dd class="bad">${esc(p.metricool)}</dd></dl>
  <div><h3 style="font-size:16px;margin-bottom:8px">Map ranking</h3><div class="tablewrap"><table><thead><tr><th>Search</th><th>From</th><th class="num">Us</th><th>Top result</th></tr></thead><tbody>${ranks}</tbody></table></div>
  <p class="note">Map results favour reviews, categories and nearby relevance. See tasks T01, T02 and T14.</p></div></div></section>`;
}

function content(d) {
  const b = d.blog, max = Math.max(...b.byMonth.map((m) => m[1]));
  const months = b.byMonth.map((m) => `<tr><td>${esc(m[0])}</td><td class="num">${m[1]}</td><td><span class="bar" style="width:${m[1] ? Math.round((m[1] / max) * 160) : 0}px"></span>${m[1] ? '' : '<span class="bad">none</span>'}</td></tr>`).join('');
  const top = b.top.map((t) => `<tr><td>${esc(t[0])}</td><td class="num">${n0(t[1])}</td></tr>`).join('');
  return `<section class="card" id="content"><div class="card-head"><h2>Blog</h2><span class="note">${b.total} published posts on Wix</span></div>
  <div class="two"><div><h3 style="font-size:16px;margin-bottom:8px">Posts per month</h3><table><tbody>${months}</tbody></table></div>
  <div><h3 style="font-size:16px;margin-bottom:8px">Most-read posts (all time, Wix views)</h3><table><thead><tr><th>Post</th><th class="num">Views</th></tr></thead><tbody>${top}</tbody></table></div></div>
  <h3 style="font-size:16px;margin:16px 0 8px">Problems found</h3><ul class="plain">${b.issues.map((i) => `<li>${esc(i)}</li>`).join('')}</ul></section>`;
}

function social(d) {
  const s = d.social;
  const rows = s.networks.map((r) => `<tr><td>${esc(r[0])}</td><td class="num">${n0(r[1])}</td><td class="num">${esc(r[2])}</td><td class="num">${n0(r[3])}</td><td class="num">${n0(r[4])}</td><td class="num">${n0(r[5])}</td></tr>`).join('');
  return `<section class="card" id="social"><div class="card-head"><h2>Social (Metricool)</h2><span class="note">${esc(s.window)} · brand "saunacompany"</span></div>
  <div class="tablewrap"><table><thead><tr><th>Account</th><th class="num">Followers</th><th class="num">Change</th><th class="num">Posts</th><th class="num">Reach / views</th><th class="num">Interactions</th></tr></thead><tbody>${rows}</tbody></table></div>
  <dl class="facts" style="margin-top:12px"><dt>Scheduled</dt><dd class="bad">${s.scheduled} posts in the next 30 days</dd>
  <dt>Connected</dt><dd>${s.connected.map(esc).join(', ')}</dd><dt>Not connected</dt><dd class="bad">${s.missing.map(esc).join(', ')}</dd></dl></section>`;
}

function technical(d) {
  const a = d.audit, bl = d.backlinks;
  const rows = a.rows.map((r) => `<tr><td>${esc(r[0])}</td><td class="num">${r[1]}</td><td>${esc(r[2])}</td></tr>`).join('');
  const trend = bl.trend.map((t) => `<tr><td>${esc(t[0])}</td><td class="num">${t[1]}</td></tr>`).join('');
  return `<section class="card" id="technical"><div class="card-head"><h2>Technical & backlinks</h2><span class="note">Site audit ${esc(a.date)}, ${a.pages} pages crawled</span></div>
  <div class="two"><div><table><thead><tr><th>Issue</th><th class="num">Pages</th><th>Level</th></tr></thead><tbody>${rows}</tbody></table><p class="note">${esc(a.note)}</p></div>
  <div><h3 style="font-size:16px;margin-bottom:8px">Backlinks: ${n0(bl.domains)} sites, ${n0(bl.backlinks)} links</h3><table><thead><tr><th>Month</th><th class="num">Referring sites</th></tr></thead><tbody>${trend}</tbody></table>
  <p class="note"><b>Relevant:</b> ${bl.good.map(esc).join(', ')}. ${esc(bl.note)}</p></div></div></section>`;
}

function routine() {
  const daily = [
    ['Ask one client for a Google review', '10 min', 'Reviews drive the map listing: we have 3, the #1 company has 52.'],
    ['Reply to every new review, message and Q&A', '5 min', 'Reply within 24 h in Google Business Profile.'],
    ['One Google Business Profile update', '10 min', 'Mon photo · Tue post · Wed service or Q&A · Thu photo · Fri post.'],
    ['Fix one page from the task list', '30 min', 'Better title, H2 with the exact search, 2–3 internal links, clear CTA.'],
    ['Check the daily blog post', '15 min', 'One new keyword from the gaps table, link to a service page + case study, end with "Book a free consultation".'],
    ['Queue one social post in Metricool', '10 min', 'Repurpose the blog or a case study; keep 7 days queued.'],
    ['One new relevant link or listing', '10 min', 'Houzz, Checkatrade, Bark, HUUM/Harvia/Saunum dealer pages, architects, local press.'],
    ['2-minute conversion check on a phone', '2 min', 'Call button, WhatsApp and form all work; "Book a free consultation" visible without scrolling.']];
  return `<section class="card" id="routine"><div class="card-head"><h2>Daily routine: better rankings, more enquiries</h2><span class="note">About 90 minutes a day · tick it off on the <a href="${esc(window.__SHEET__)}" target="_blank" rel="noopener">Daily tab of the task sheet</a></span></div>
  <div class="tablewrap"><table><thead><tr><th>#</th><th>Every day</th><th>Time</th><th>How</th></tr></thead><tbody>${daily.map((r, i) => `<tr><td>${i + 1}</td><td><b>${esc(r[0])}</b></td><td class="num">${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table></div>
  <div class="routine" style="margin-top:12px">
  <div><b>Monday · 30 min</b>Read this dashboard, pick the week's tasks from the top of the list, check Search Console for errors.</div>
  <div><b>Friday · 20 min</b>Update Status on the Tasks tab, note reviews, map rank and clicks, send Deepti a 3-line update.</div>
  </div></section>`;
}
</script>
</body>
</html>
