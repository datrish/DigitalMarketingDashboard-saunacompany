<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sauna & Pool Marketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #eef1ef; --card: #ffffff; --ink: #1d2b2f; --muted: #5d6a6d; --line: #d8dedb; --soft: #f4f6f5;
  --sauna: #a8652f; --sauna-soft: #f5e8dc; --pool: #2c6e7a; --pool-soft: #dfeef0; --both: #6b5a8e; --both-soft: #ebe7f3;
  --timber: #a8652f; --good: #2e7a50; --good-bg: #e2f1e8; --bad: #b24a34; --bad-bg: #f9e5df; --warn: #8f6400; --warn-bg: #fbefd2;
  --blue: #2c6e7a; --blue-bg: #dfeef0; --u: #b24a34; --h: #8f6400; --m: #2c6e7a;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141a1b; --card: #1c2426; --ink: #e6ecea; --muted: #9eaaa8; --line: #2f3a3c; --soft: #222c2e;
  --sauna: #d99a63; --sauna-soft: #3a2a1d; --pool: #6fb6c2; --pool-soft: #18343a; --both: #b3a2d6; --both-soft: #2b2638;
  --timber: #d99a63; --good: #6cc48f; --good-bg: #1d3327; --bad: #f08a76; --bad-bg: #3d231e; --warn: #e6b84a; --warn-bg: #3a3018;
  --blue: #6fb6c2; --blue-bg: #18343a; --u: #f08a76; --h: #e6b84a; --m: #6fb6c2; } }
:root[data-theme="dark"] {
  --bg: #141a1b; --card: #1c2426; --ink: #e6ecea; --muted: #9eaaa8; --line: #2f3a3c; --soft: #222c2e;
  --sauna: #d99a63; --sauna-soft: #3a2a1d; --pool: #6fb6c2; --pool-soft: #18343a; --both: #b3a2d6; --both-soft: #2b2638;
  --timber: #d99a63; --good: #6cc48f; --good-bg: #1d3327; --bad: #f08a76; --bad-bg: #3d231e; --warn: #e6b84a; --warn-bg: #3a3018;
  --blue: #6fb6c2; --blue-bg: #18343a; --u: #f08a76; --h: #e6b84a; --m: #6fb6c2; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 "IBM Plex Sans", system-ui, sans-serif; }
h1, h2, h3 { font-family: "Bricolage Grotesque", system-ui, sans-serif; margin: 0; letter-spacing: -0.01em; }
a { color: var(--pool); }
:focus-visible { outline: 2px solid var(--pool); outline-offset: 2px; }
.wrap { max-width: 860px; margin: 0 auto; padding: 0 16px 80px; }
header.top { padding: 22px 0 6px; }
header.top h1 { font-size: 24px; }
.sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
nav.tabs { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0; margin-bottom: 8px; }
nav.tabs .seg { display: grid; grid-template-columns: repeat(6, 1fr); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
nav.tabs a { text-align: center; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 14px; padding: 8px 4px; border-radius: 9px; }
nav.tabs a[aria-current="page"] { background: var(--ink); color: var(--card); }
nav.tabs a .n { font-weight: 500; opacity: .75; margin-left: 4px; font-variant-numeric: tabular-nums; }
.view[hidden] { display: none; }
.lede { font-size: 15px; color: var(--muted); margin: 6px 0 14px; max-width: 62ch; }
.kwbox { min-width: 0; } .kwbox th, .kwbox td { padding-left: 6px; padding-right: 6px; } .kwbox th.num { white-space: normal; width: 64px; } .kwbox .sub2 { margin: 6px 0; }
.pill.s-new { background: #e4f1e6; color: #24613a; font-size: 11.5px; padding: 1px 7px; }
.panel.mentor { border-left: 4px solid var(--ink); } .panel.mentor li { margin: 0 0 8px; } .panel.mentor .site { margin-right: 4px; }
.good { color: #24613a; font-size: 13px; } .delta .bad { font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
.chips button { font: inherit; font-size: 13.5px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
.group { margin: 18px 0 8px; display: flex; align-items: baseline; gap: 8px; }
.group h2 { font-size: 18px; }
.group .cnt { color: var(--muted); font-size: 13px; }
.task { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; overflow: hidden; }
.task::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--both); }
.task[data-site="Sauna"]::before { background: var(--sauna); }
.task[data-site="Pool"]::before { background: var(--pool); }
.task summary { list-style: none; cursor: pointer; padding: 12px 14px 12px 20px; }
.task summary::-webkit-details-marker { display: none; }
.task .ttl { font-weight: 600; display: block; }
.task .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.task .body { padding: 2px 16px 16px 20px; border-top: 1px solid var(--line); }
.task .why { margin: 10px 0; font-size: 14px; }
.task ol { margin: 6px 0 0; padding-left: 20px; font-size: 14px; }
.task ol li { margin-bottom: 4px; word-break: break-word; }
.task[open] { border-color: var(--ink); }
.site { font-weight: 600; }
.site.Sauna { color: var(--sauna); } .site.Pool { color: var(--pool); } .site.Both, .site.Aqua { color: var(--both); }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.s-todo { background: var(--soft); color: var(--muted); } .s-doing { background: var(--warn-bg); color: var(--warn); } .s-done { background: var(--good-bg); color: var(--good); } .s-block { background: var(--bad-bg); color: var(--bad); }
.more { width: 100%; font: inherit; font-size: 14px; padding: 10px; border: 1px dashed var(--line); border-radius: 12px; background: transparent; color: var(--muted); cursor: pointer; }
.upd { margin-top: 14px; padding: 12px; background: var(--soft); border-radius: 10px; display: grid; gap: 8px; }
.upd .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.upd select, .upd textarea, .upd input, .rng input { font: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); width: 100%; }
.upd button.save { font: inherit; font-weight: 600; font-size: 14px; padding: 9px 18px; border-radius: 999px; border: 0; background: var(--ink); color: var(--card); cursor: pointer; justify-self: start; }
.upd .msg { font-size: 13px; color: var(--muted); }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
.nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 10px; }
.num-b { background: var(--soft); border-radius: 10px; padding: 10px 12px; }
.num-b .lbl { font-size: 13px; color: var(--muted); }
.num-b .big { font: 700 28px/1.1 "Bricolage Grotesque", sans-serif; margin-top: 2px; font-variant-numeric: tabular-nums; }
.num-b .delta { font-size: 12.5px; margin-top: 2px; }
.up { color: var(--good); } .down { color: var(--bad); }
.split { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 14px; }
.sitecard { border-top: 5px solid var(--sauna); }
.sitecard.pool { border-top-color: var(--pool); }
.sitecard h2 { font-size: 20px; margin-bottom: 2px; }
.bars { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; align-items: end; height: 120px; margin: 14px 0 4px; }
.bars div { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; font-size: 12px; color: var(--muted); }
.bars span.b { width: 100%; border-radius: 6px 6px 2px 2px; background: var(--sauna); min-height: 3px; }
.pool .bars span.b { background: var(--pool); }
.bars b { font-size: 13px; color: var(--ink); margin-bottom: 3px; font-variant-numeric: tabular-nums; }
.take { margin: 12px 0 0; padding-left: 18px; font-size: 14px; } .take li { margin-bottom: 6px; }
.note { color: var(--muted); font-size: 12.5px; }
.rng { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; }
.rng .dates { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.rng input { width: auto; padding: 5px 8px; }
.logitem { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.logitem:last-child { border-bottom: 0; }
.logitem .when { font-size: 12.5px; color: var(--muted); }
details.acc { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; }
details.acc > summary { cursor: pointer; padding: 14px 16px; font: 600 16px "Bricolage Grotesque", sans-serif; list-style: none; display: flex; justify-content: space-between; }
details.acc > summary::after { content: "+"; color: var(--muted); }
details.acc[open] > summary::after { content: "–"; }
details.acc > summary::-webkit-details-marker { display: none; }
details.acc > .in { padding: 0 16px 16px; }
details.acc section.card { border: 0; padding: 0; margin: 0; background: transparent; }
details.acc .card-head { display: none; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { text-align: left; font-weight: 600; font-size: 12.5px; color: var(--muted); padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.url { font-size: 12.5px; word-break: break-all; min-width: 180px; }
.chart { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; }
.bar { display: inline-block; height: 8px; border-radius: 4px; background: var(--timber); vertical-align: middle; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 14px; margin: 0; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; }
.bad { color: var(--bad); font-weight: 600; }
ul.plain { margin: 0; padding-left: 18px; font-size: 14px; } ul.plain li { margin-bottom: 5px; }
.links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.links a { font-size: 13px; text-decoration: none; padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--ink); }
.empty { padding: 14px; text-align: center; color: var(--muted); font-size: 14px; background: var(--card); border: 1px dashed var(--line); border-radius: 12px; }
.err { padding: 20px; color: var(--bad); }
@media (max-width: 560px) { header.top h1 { font-size: 21px; } nav.tabs a { font-size: 12px; padding: 8px 2px; } nav.tabs a .n { margin-left: 2px; } .num-b .big { font-size: 24px; } }
@media (prefers-reduced-motion: no-preference) { .task[open] .body { animation: open .18s ease-out; } @keyframes open { from { opacity: 0; transform: translateY(-4px); } } }
.chipb { font: inherit; font-size: 13.5px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
.chipb[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
.chan { background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--sauna); border-radius: 12px; padding: 14px 16px; }
.chan.pool { border-left-color: var(--pool); }
.chead { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin-bottom: 8px; }
.live { margin: 0 0 4px; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; color: var(--good); }
.live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.live.off { color: var(--bad); } .live.off .dot { background: var(--bad); }
.ptitle { font-weight: 600; display: block; margin-bottom: 8px; }
.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; font-size: 13px; }
.checks div { display: flex; justify-content: space-between; gap: 6px; }
.ck { font-weight: 600; } .ck.yes { color: var(--good); } .ck.no { color: var(--bad); }
.sub2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 12px 0 4px; }
.li { display: flex; flex-direction: column; padding: 5px 0; border-top: 1px solid var(--line); font-size: 14px; }
.li:first-of-type { border-top: 0; }
.attn { border-color: var(--bad); background: var(--bad-bg); }
.attn h2 { font-size: 17px; color: var(--bad); margin-bottom: 6px; }
.attn ul { margin: 0; padding-left: 18px; font-size: 14px; } .attn li { margin-bottom: 4px; }
.warnb { background: var(--bad-bg); } .warnb .lbl { color: var(--bad); }
.big.sm, .big .sm { font-size: 18px; }
nav.tabs a .n:empty { display: none; }
#n-warn { color: var(--bad); opacity: 1; }
nav.tabs a[aria-current="page"] #n-warn { color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Sauna &amp; Pool Company marketing</h1>
    <div class="sub" id="updated">Loading…</div>
  </header>
  <nav class="tabs" aria-label="Views"><div class="seg">
    <a href="#today" data-v="today">Today<span class="n" id="n-warn" aria-label="warnings"></span></a>
    <a href="#todo" data-v="todo">To do<span class="n" id="n-todo"></span></a>
    <a href="#done" data-v="done">Done</a>
    <a href="#social" data-v="social">Social</a>
    <a href="#results" data-v="results">Results</a>
    <a href="#details" data-v="details">Details</a>
  </div></nav>
  <main id="app"></main>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const n0 = (v) => (v == null ? '–' : Number(v).toLocaleString('en-GB'));
const pctChange = (a, b) => (b ? Math.round(((a - b) / b) * 100) : null);
const arrow = (d, good) => (d == null ? '' : `<span class="${(d >= 0) === (good !== 'down') ? 'up' : 'down'}">${d >= 0 ? '▲' : '▼'} ${Math.abs(d)}%</span>`);
const STATUS = { 'To do': 's-todo', 'In progress': 's-doing', 'Done': 's-done', 'Blocked': 's-block', 'Needs Deepti': 's-block' };

fetch('data.json', { cache: 'no-store' }).then((r) => r.json()).then(loadLive).then(render).catch((e) => { $('#app').innerHTML = `<div class="err">Could not load data.json (${esc(e.message)}).</div>`; });




// ---- Live tracker (Google Apps Script web app) ----
const PRI = { '1 - High': 'Urgent', '2 - Medium': 'High', '3 - Low': 'Medium' };
const ST = { 'Not started': 'To do' };
const steps = (s) => String(s || '').replace(/ ; /g, ';').split(';').map((x) => x.trim()).filter(Boolean);
function loadLive(d) {
  d.log = []; d.socialLog = [];
  const api = d.meta.trackerApi;
  if (!api) return d;
  return fetch(api, { cache: 'no-store' }).then((r) => r.json()).then((j) => {
    if (!j.ok) return d;
    d.live = true;
    d.tasks = j.tasks.map((r) => ({
      id: r['ID'], priority: PRI[r['Priority']] || 'Medium', area: r['Area'], site: r['Site'], owner: r['Owner'] || 'Ruchi',
      status: ST[r['Status']] || r['Status'] || 'To do', rawStatus: r['Status'], due: r['Target date'], done_on: r['Date done'],
      title: r['Task'], why: r['Why (source)'], steps: steps(r['Pages / detail']), notes: r["Ruchi's notes / proof link"], minutes: Number(r['Time spent (min)']) || 0 }));
    d.log = j.log || [];
    if (j.pulse) d.pulse = Object.assign({}, d.pulse || {}, j.pulse);
    d.socialLog = j.social || [];
    d.liveAt = j.at;
    return d;
  }).catch(() => d);
}
const ukDate = (s) => { const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s || ''); return m ? new Date(+m[3], +m[2] - 1, +m[1]) : null; };
const isoDate = (s) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
const hm = (m) => (m >= 60 ? `${Math.floor(m / 60)}h ${m % 60 ? (m % 60) + 'm' : ''}`.trim() : `${m}m`);
function getKey() { try { return localStorage.getItem('trackerKey') || ''; } catch (e) { return ''; } }
function setKey(k) { try { localStorage.setItem('trackerKey', k); } catch (e) {} }


function chart(monthly) {
  const W = 760, H = 240, pad = { l: 44, r: 44, t: 14, b: 28 };
  const cw = (W - pad.l - pad.r) / monthly.length;
  const maxC = Math.max(...monthly.map((m) => m[1])) * 1.15, maxI = Math.max(...monthly.map((m) => m[2])) * 1.15;
  const y = (v, m) => pad.t + (H - pad.t - pad.b) * (1 - v / m);
  const bars = monthly.map((m, i) => `<rect x="${pad.l + i * cw + cw * 0.2}" y="${y(m[1], maxC)}" width="${cw * 0.6}" height="${H - pad.b - y(m[1], maxC)}" rx="3" fill="var(--timber)"><title>${m[0]}: ${n0(m[1])} clicks</title></rect>
    <text x="${pad.l + i * cw + cw / 2}" y="${H - 9}" font-size="11" text-anchor="middle" fill="var(--muted)">${m[0].split(' ')[0]}</text>`).join('');
  const line = monthly.map((m, i) => `${i ? 'L' : 'M'}${pad.l + i * cw + cw / 2},${y(m[2], maxI)}`).join(' ');
  const dots = monthly.map((m, i) => `<circle cx="${pad.l + i * cw + cw / 2}" cy="${y(m[2], maxI)}" r="3.5" fill="var(--blue)"><title>${m[0]}: ${n0(m[2])} impressions</title></circle>`).join('');
  const ticks = [0, 0.5, 1].map((f) => `<text x="${pad.l - 6}" y="${y(maxC * f / 1.15, maxC) + 4}" font-size="11" text-anchor="end" fill="var(--muted)">${Math.round(maxC * f / 1.15)}</text>
    <text x="${W - pad.r + 6}" y="${y(maxI * f / 1.15, maxI) + 4}" font-size="11" fill="var(--muted)">${Math.round(maxI * f / 1.15 / 1000)}k</text>
    <line x1="${pad.l}" x2="${W - pad.r}" y1="${y(maxC * f / 1.15, maxC)}" y2="${y(maxC * f / 1.15, maxC)}" stroke="var(--line)"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly Google clicks and impressions">${ticks}${bars}<path d="${line}" fill="none" stroke="var(--blue)" stroke-width="2.5"/>${dots}</svg>
  <div class="legend"><span><i style="background:var(--timber)"></i>Clicks (left)</span><span><i style="background:var(--blue)"></i>Impressions (right)</span></div>`;
}

function search(d) {
  const q = d.queries.map((r) => `<tr><td>${esc(r[0])}</td><td class="num">${n0(r[1])}</td><td class="num">${n0(r[2])}</td><td class="num">${r[3].toFixed(1)}</td></tr>`).join('');
  const s = d.striking.map((r) => `<tr><td>${esc(r[0])}</td><td class="num">${n0(r[1])}</td><td class="num">${r[2].toFixed(1)}</td><td class="url">${esc(r[3])}</td></tr>`).join('');
  return `<section class="card" id="search"><div class="card-head"><h2>Google search: 12 months</h2><span class="note">Search Console, all devices</span></div>${chart(d.monthly)}
  <div class="two" style="margin-top:16px">
    <div><h3 style="font-size:16px;margin-bottom:8px">Top searches (last 3 months)</h3><div class="tablewrap"><table><thead><tr><th>Search</th><th class="num">Clicks</th><th class="num">Impr.</th><th class="num">Pos.</th></tr></thead><tbody>${q}</tbody></table></div></div>
    <div><h3 style="font-size:16px;margin-bottom:8px">Close to page 1: quick wins</h3><p class="note" style="margin:0 0 6px">Ranking 5–30 with real demand. A better title, H2 and internal links can move these. See T17.</p><div class="tablewrap"><table><thead><tr><th>Search</th><th class="num">Impr.</th><th class="num">Pos.</th><th>Page to improve</th></tr></thead><tbody>${s}</tbody></table></div></div>
  </div></section>`;
}

function pagesSec(d) {
  const rows = d.pages.map((r) => `<tr><td class="url">${esc(r[0])}</td><td class="num">${n0(r[1])}</td><td class="num">${n0(r[2])}</td><td class="num${r[3] < 1 ? ' bad' : ''}">${r[3].toFixed(2)}%</td><td class="num${r[4] > 20 ? ' bad' : ''}">${r[4].toFixed(1)}</td><td>${esc(r[5])}</td></tr>`).join('');
  return `<section class="card" id="pages"><div class="card-head"><h2>Pages that need work</h2><span class="note">Last 3 months · red = CTR under 1% or position worse than 20</span></div>

// ---------- Today (channel pulse) ----------
const fmtD = (s) => { const d = isoDate(s); return d ? d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) : esc(s || ''); };
const daysAgo = (s) => { const d = isoDate(s); if (!d) return null; const t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((t - d) / 86400000); };
function pulseWarnings(d) {
  const P = d.pulse; if (!P) return [];
  const w = [];
  (P.blogs || []).forEach((b) => (b.warn || []).forEach((x) => w.push([b.site, 'Blog', x])));
  (P.social || []).forEach((s) => (s.warn || []).forEach((x) => w.push([s.site, 'Social', x])));
  (P.gbp || []).forEach((g) => { (g.warn || []).forEach((x) => w.push([g.site, 'Google profile', x])); const a = daysAgo(g.lastPost); if (a != null && a > 7) w.push([g.site, 'Google profile', `No post for ${a} days`]); });
  return w;
}
function todayView(d, warns) {
  const P = d.pulse;
  if (!P) return '<p class="empty">No channel check yet. It runs at about 8am and 6pm on weekdays.</p>';
  const ok = (v) => `<span class="ck ${v ? 'yes' : 'no'}">${v ? 'Yes' : 'Missing'}</span>`;

    ${(b.recent || []).length ? `<div class="sub2">Recent</div>${b.recent.map((r) => `<div class="li"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a><span class="note">${fmtD(r.date)}${r.issues.length ? ` · <span class="bad">${esc(r.issues.join(', '))}</span>` : ''}</span></div>`).join('')}` : ''}
    ${(b.next || []).length ? `<div class="sub2">Coming up</div>${b.next.map((n) => `<div class="li"><span>${esc(n.title)}</span><span class="note">${fmtD(n.date)}</span></div>`).join('')}` : ''}</div>`).join('');
  const social = (P.social || []).map((s) => `<div class="chan ${s.site === 'Pool' ? 'pool' : ''}"><div class="chead">${siteTag(s.site)}<span class="note">${esc(s.networks)}</span></div>

    <div class="num-b"><div class="lbl">Next post</div><div class="big sm">${s.next ? fmtD(s.next) : 'None'}</div></div></div></div>`).join('');
  const gbp = (P.gbp || []).map((g) => { const a = daysAgo(g.lastPost); return `<div class="chan ${g.site === 'Pool' ? 'pool' : ''}"><div class="chead">${siteTag(g.site)}<a class="note" href="${esc(g.url)}" target="_blank" rel="noopener">Open on Google</a></div>
    <div class="nums"><div class="num-b${g.reviews < 10 ? ' warnb' : ''}"><div class="lbl">Reviews</div><div class="big">${g.rating}★ <span class="sm">(${g.reviews})</span></div></div>
    <div class="num-b${a != null && a > 7 ? ' warnb' : ''}"><div class="lbl">Last post</div><div class="big sm">${a === 0 ? 'Today' : a === 1 ? 'Yesterday' : a != null ? a + ' days ago' : '–'}</div><div class="delta note">${g.posts7} posts in 7 days</div></div>
    <div class="num-b"><div class="lbl">Photos</div><div class="big">${g.photos}</div></div></div></div>`; }).join('');
  return `<p class="lede">Leads, Google, blog, social media and Google profile for both businesses. Checked at about 8am and 6pm on weekdays; last check ${esc(P.updated)}.</p>
  ${weekBlock(P.week)}
  ${warns.length ? `<div class="panel attn"><h2>Needs attention</h2><ul>${warns.map(([s, c, x]) => `<li><span class="site ${s}">${s}</span> · ${esc(c)}: ${esc(x)}</li>`).join('')}</ul></div>` : '<div class="panel"><b>All on track.</b></div>'}

function weekBlock(W) {
  if (!W) return '';
  const tag = (s) => `<span class="site ${s}">${s === 'Both' ? 'Both' : s}</span>`;
  const chg = (a, b, good) => { if (b == null || a === b) return '<span class="note">same</span>'; const up = a > b; return `<span class="${up === good ? 'good' : 'bad'}">${up ? '▲' : '▼'} from ${n0(b)}</span>`; };

  const srch = (W.search || []).map((s) => `<div class="chan ${s.site === 'Pool' ? 'pool' : ''}"><div class="chead">${tag(s.site)}<span class="note">Google, UK</span></div>

  const kws = (site) => { const k = (W.keywords || []).filter((x) => x.site === site).slice(0, 8); if (!k.length) return '';
    return `<div class="kwbox"><div class="sub2">${tag(site)} keywords moving up</div><div class="tablewrap"><table><thead><tr><th>Search</th><th class="num">UK searches a month</th><th class="num">Now</th><th class="num">Was</th></tr></thead><tbody>

  const mentor = (W.mentor || []).length ? `<div class="panel mentor"><h2>What to do about it</h2><ul>${W.mentor.map((m) => `<li>${tag(m.site)} ${esc(m.text)}</li>`).join('')}</ul><p class="note">${esc(W.mentorNote || '')}</p></div>` : '';
  return `<div class="group"><h2>This week</h2></div>

  <div class="split">${kws('Sauna')}${kws('Pool')}</div><p class="note">${esc(W.keywordsNote || '')}</p>

}

function todoView(d) {
  return `<p class="lede">What to work on, most important first. Tap a task to see the steps and save an update.</p>
  <div class="chips" id="sitechips" role="group" aria-label="Filter by site">${[['all', 'All'], ['Sauna', 'Sauna'], ['Pool', 'Pool'], ['Both', 'Both sites']].map(([k, l]) => `<button data-s="${k}" aria-pressed="${STATE.site === k}">${l}</button>`).join('')}</div>
  <div class="chips" id="whochips" role="group" aria-label="Filter by person">${[['all', 'Everyone'], ['Ruchi', 'Ruchi'], ['Ajay', 'Ajay']].map(([k, l]) => `<button data-w="${k}" aria-pressed="${STATE.who === k}">${l}</button>`).join('')}</div>
  <div id="todolist">${todoList(d)}</div>`;
}
function todoList(d) {
  const open = d.tasks.filter((t) => t.status !== 'Done' && (STATE.site === 'all' || SITE(t) === STATE.site) && (STATE.who === 'all' || t.owner === STATE.who));
  const rank = (t) => (t.status === 'In progress' ? 0 : t.status === 'Blocked' || t.status === 'Needs Deepti' ? 2 : 1);
  const grp = (p) => open.filter((t) => t.priority === p).sort((a, b) => rank(a) - rank(b));
  const now = grp('Urgent'), next = grp('High'), later = grp('Medium');
  const block = (title, list, hide) => list.length ? `<div class="group"><h2>${title}</h2><span class="cnt">${list.length}</span></div>
    ${hide ? `<button class="more" data-more="${title}">Show ${list.length} more</button><div hidden data-list="${title}">` : '<div>'}${list.map((t) => taskCard(d, t)).join('')}</div>` : '';
  return (now.length + next.length + later.length) ? block('Do now', now) + block('Next', next) + block('Later', later, true) : '<p class="empty">Nothing open here.</p>';
}
function wireTodo(d) {

function wireMore() {

}
function updForm(d, t) {

  const opts = ['Not started', 'In progress', 'Done', 'Blocked', 'Needs Deepti'].map((x) => `<option${(t.rawStatus || '') === x ? ' selected' : ''}>${x}</option>`).join('');
  return `<form class="upd" data-id="${esc(t.id)}">
    <div class="row"><label><span class="note">Status</span><select name="status">${opts}</select></label>
    <label><span class="note">Time spent (min)</span><input name="minutes" type="number" min="0" max="600" step="5" inputmode="numeric" placeholder="0"></label></div>

    <button type="submit" class="save">Save update</button><span class="msg" role="status"></span></form>`;
}
function wireUpdates(d) {
  if (!d.live) return;
  document.querySelectorAll('form.upd[data-id]').forEach((f) => { if (f.dataset.w) return; f.dataset.w = 1; f.addEventListener('submit', (e) => {
    e.preventDefault();
    const msg = f.querySelector('.msg'); msg.textContent = 'Saving…';
    const body = { id: f.dataset.id, status: f.status.value, comment: f.comment.value, minutes: f.minutes.value, key: f.key.value };
    fetch(d.meta.trackerApi, { method: 'POST', body: JSON.stringify(body) }).then((r) => r.json()).then((j) => {
      if (!j.ok) { if (j.error === 'wrong passcode') setKey(''); msg.textContent = j.error === 'wrong passcode' ? 'Wrong passcode. Reload and enter it again.' : 'Not saved: ' + j.error; return; }
      setKey(body.key); msg.textContent = 'Update saved.';
      fetch('data.json', { cache: 'no-store' }).then((r) => r.json()).then(loadLive).then(render);
    }).catch(() => { msg.textContent = 'Not saved: the tracker didn’t respond. Try again.'; });
  }); });
}
function getKey() { try { return localStorage.getItem('trackerKey') || ''; } catch (e) { return ''; } }
function setKey(k) { try { localStorage.setItem('trackerKey', k); } catch (e) {} }

// ---------- Done ----------
function doneView(d) {
  return `<p class="lede">What got finished and how long it took. Pick a period.</p>
  <div class="rng" id="rng">${[['today', 'Today'], ['yesterday', 'Yesterday'], ['week', 'Last 7 days'], ['month', 'This month'], ['all', 'All']].map(([k, l]) => `<button class="chipb" data-r="${k}" aria-pressed="${k === 'today'}">${l}</button>`).join('')}
  <span class="dates"><input type="date" id="rfrom" aria-label="From date"><input type="date" id="rto" aria-label="To date"><button class="chipb" data-r="custom" aria-pressed="false">Show dates</button></span></div>
  <div id="progout"></div>`;
}
function wireProgress(d) {
  const out = $('#progout'); if (!out) return;
  const show = (from, to, label) => {
    const inR = (dt) => dt && dt >= from && dt <= to;
    const done = new Map();
    d.tasks.forEach((t) => { const dt = ukDate(t.done_on); if (t.status === 'Done' && inR(dt)) done.set(t.id, t); });
    const ups = d.log.filter((l) => inR(isoDate(l.when))).reverse();
    ups.filter((l) => l.to === 'Done').forEach((l) => { const t = d.tasks.find((x) => x.id === l.id); if (t) done.set(l.id, t); });
    const mins = ups.reduce((a, l) => a + (l.minutes || 0), 0);
    out.innerHTML = `<div class="panel"><div class="nums">
      <div class="num-b"><div class="lbl">Tasks finished</div><div class="big">${done.size}</div></div>
      <div class="num-b"><div class="lbl">Updates</div><div class="big">${ups.length}</div></div>
      <div class="num-b"><div class="lbl">Time logged</div><div class="big">${hm(mins)}</div></div>
      <div class="num-b"><div class="lbl">Still open</div><div class="big">${d.tasks.filter((t) => t.status !== 'Done').length}</div></div></div></div>
      <div class="group"><h2>Finished ${esc(label)}</h2></div>
      ${done.size ? [...done.values()].map((t) => taskCard(d, t)).join('') : `<p class="empty">Nothing finished ${esc(label)}.</p>`}
      <div class="group"><h2>Updates and comments</h2></div>
      ${ups.length ? `<div class="panel">${ups.map((l) => `<div class="logitem"><div class="when">${esc(l.when)} · ${esc(l.by)}${l.minutes ? ` · ${hm(l.minutes)}` : ''}</div><b>${esc(l.task)}</b> <span class="pill ${STATUS[ST[l.to] || l.to] || 's-todo'}">${esc(l.to)}</span>${l.comment ? `<div>${esc(l.comment)}</div>` : ''}</div>`).join('')}</div>` : `<p class="empty">No updates ${esc(label)}.</p>`}`;
    wireUpdates(d);
  };
  const range = (k) => {
    const t = new Date(); t.setHours(0, 0, 0, 0); const end = new Date(t); end.setHours(23, 59, 59);
    if (k === 'today') return [t, end, 'today'];
    if (k === 'yesterday') { const y = new Date(t); y.setDate(y.getDate() - 1); const ye = new Date(y); ye.setHours(23, 59, 59); return [y, ye, 'yesterday']; }
    if (k === 'week') { const w = new Date(t); w.setDate(w.getDate() - 6); return [w, end, 'in the last 7 days']; }
    if (k === 'month') return [new Date(t.getFullYear(), t.getMonth(), 1), end, 'this month'];
    if (k === 'custom') { const f = $('#rfrom').value, to = $('#rto').value; if (!f || !to) return null; const a = isoDate(f), b = isoDate(to); b.setHours(23, 59, 59); return [a, b, `${f} to ${to}`]; }
    return [new Date(2000, 0, 1), end, 'so far'];
  };
  document.querySelectorAll('#rng button').forEach((b) => b.addEventListener('click', () => {
    const r = range(b.dataset.r); if (!r) return;
    document.querySelectorAll('#rng button').forEach((x) => x.setAttribute('aria-pressed', x === b));
    show(...r);
  }));
  show(...range('today'));
}

// ---------- Social (Ajay) ----------
function socialView(d) {
  const P = d.pulse || {}, posts = (P.socialPosts || []).slice().sort((a, b) => (a.date < b.date ? 1 : -1));
  const S = d.socialLog || [];
  const sum = (arr, k) => arr.reduce((a, x) => a + (Number(x[k]) || 0), 0);
  const since = (days) => { const t = new Date(); t.setHours(0, 0, 0, 0); t.setDate(t.getDate() - days + 1); return t; };
  const in7 = (s) => { const x = isoDate(s); return x && x >= since(7); };
  const live7 = posts.filter((p) => in7(p.date));
  const log7 = S.filter((l) => in7(l.date));
  const mins7 = sum(log7, 'minutes'), comments7 = sum(log7, 'comments'), leads7 = sum(log7, 'leads');
  const made7 = log7.filter((l) => l.type === 'Post made').length;
  const reach30 = sum(posts, 'reach'), int30 = sum(posts, 'interactions');
  const flagged = posts.filter((p) => p.flag);
  const queued = (P.social || []).reduce((a, s) => a + (s.queued7 || 0), 0);
  const form = d.live ? `<form class="upd" id="soclog"><b>Log your work</b>
    <div class="row"><label><span class="note">What did you do?</span><select name="type">${['Post made', 'Post went live', 'Outreach (comments)', 'Replies to comments/messages', 'Lead passed to Kiana', 'Other'].map((x) => `<option>${x}</option>`).join('')}</select></label>
    <label><span class="note">Business</span><select name="site"><option>Sauna</option><option>Pool</option><option>Both</option></select></label></div>
    <div class="row"><label><span class="note">Network</span><select name="network">${['Instagram', 'Facebook', 'LinkedIn', 'Pinterest', 'TikTok', 'YouTube', 'Google profile', 'Several'].map((x) => `<option>${x}</option>`).join('')}</select></label>
    <label><span class="note">Time spent (min)</span><input name="minutes" type="number" min="0" max="600" step="5" inputmode="numeric" placeholder="0"></label></div>
    <div class="row"><label><span class="note">Comments made</span><input name="comments" type="number" min="0" max="500" inputmode="numeric" placeholder="0"></label>
    <label><span class="note">Leads passed to Kiana</span><input name="leads" type="number" min="0" max="50" inputmode="numeric" placeholder="0"></label></div>
    <label><span class="note">From which blog post? (link)</span><input name="blog" type="url" placeholder="https://www.saunacompany.co.uk/post/…"></label>
    <label><span class="note">Link to the post or the account you engaged with</span><input name="link" type="url"></label>
    <label><span class="note">Notes</span><textarea name="notes" rows="2"></textarea></label>
    ${getKey() ? `<input name="key" type="hidden" value="${esc(getKey())}">` : `<label><span class="note">Your passcode (asked once on this device)</span><input name="key" type="password" autocomplete="off"></label>`}
    <button type="submit" class="save">Save to log</button><span class="msg" role="status"></span></form>` : '';
  return `<p class="lede">Ajay's social media work: posts made from the blogs, what went live, the results, outreach and leads.</p>
  <div class="panel"><div class="nums">
    <div class="num-b"><div class="lbl">Posts live, last 7 days</div><div class="big">${live7.length}</div><div class="delta note">Instagram + Facebook</div></div>
    <div class="num-b${queued < 3 ? ' warnb' : ''}"><div class="lbl">Queued, next 7 days</div><div class="big">${queued}</div></div>
    <div class="num-b"><div class="lbl">Comments made, 7 days</div><div class="big">${comments7}</div></div>
    <div class="num-b"><div class="lbl">Leads passed, 7 days</div><div class="big">${leads7}</div></div>
    <div class="num-b"><div class="lbl">Time logged, 7 days</div><div class="big">${hm(mins7)}</div><div class="delta note">${made7} posts made</div></div>
    <div class="num-b"><div class="lbl">Reach per post, 30 days</div><div class="big">${posts.length ? Math.round(reach30 / posts.length) : 0}</div><div class="delta note">${posts.length ? (int30 / posts.length).toFixed(1) : 0} interactions per post</div></div>
  </div></div>
  ${flagged.length ? `<div class="panel attn"><h2>Fix now</h2><ul><li>${flagged.length} live posts still show leftover ChatGPT text, e.g. "Want the bg image prompts for this one?". Edit the captions (task A2).</li></ul></div>` : ''}
  ${form}
  <div class="group"><h2>Posts that went live</h2><span class="cnt">${esc(P.socialWindow || '')}</span></div>
  ${posts.length ? `<div class="panel tablewrap"><table><thead><tr><th>Date</th><th>Post</th><th class="num">Reach</th><th class="num">Inter&shy;actions</th></tr></thead><tbody>${posts.map((p) => `<tr><td><span class="site ${p.site}">${p.site}</span><br><span class="note">${fmtD(p.date)} · ${esc(p.network)}</span></td><td><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>${p.flag ? `<br><span class="bad">${esc(p.flag)}</span>` : ''}</td><td class="num">${n0(p.reach)}</td><td class="num">${n0(p.interactions)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="empty">No posts found in this period.</p>'}
  <div class="group"><h2>Ajay's log</h2><span class="cnt">${S.length}</span></div>
  ${S.length ? `<div class="panel">${S.slice().reverse().slice(0, 40).map((l) => `<div class="logitem"><div class="when">${esc(l.when)} · ${esc(l.by)} · <span class="site ${esc(l.site)}">${esc(l.site)}</span> · ${esc(l.network)}${l.minutes ? ` · ${hm(l.minutes)}` : ''}</div><b>${esc(l.type)}</b>${l.comments ? ` · ${l.comments} comments` : ''}${l.leads ? ` · <b>${l.leads} lead${l.leads > 1 ? 's' : ''}</b>` : ''}${l.link ? ` · <a href="${esc(l.link)}" target="_blank" rel="noopener">link</a>` : ''}${l.blog ? ` · <a href="${esc(l.blog)}" target="_blank" rel="noopener">blog</a>` : ''}${l.notes ? `<div>${esc(l.notes)}</div>` : ''}</div>`).join('')}</div>` : '<p class="empty">Nothing logged yet. Ajay logs each post he makes, each outreach session and each lead.</p>'}`;
}
function wireSocial(d) {
  const f = $('#soclog'); if (!f || !d.live) return;
  f.addEventListener('submit', (e) => {
    e.preventDefault();
    const msg = f.querySelector('.msg'); msg.textContent = 'Saving…';
    const v = (n) => f[n].value;
    const body = { kind: 'social', type: v('type'), site: v('site'), network: v('network'), minutes: v('minutes'), comments: v('comments'), leads: v('leads'), blog: v('blog'), link: v('link'), notes: v('notes'), key: v('key') };
    fetch(d.meta.trackerApi, { method: 'POST', body: JSON.stringify(body) }).then((r) => r.json()).then((j) => {
      if (!j.ok) { if (j.error === 'wrong passcode') setKey(''); msg.textContent = j.error === 'wrong passcode' ? 'Wrong passcode. Reload and enter it again.' : 'Not saved: ' + j.error; return; }
      setKey(body.key); msg.textContent = 'Saved to the log.';
      fetch('data.json', { cache: 'no-store' }).then((r) => r.json()).then(loadLive).then((dd) => { render(dd); location.hash = '#social'; });
    }).catch(() => { msg.textContent = 'Not saved: the tracker didn’t respond. Try again.'; });
  });
}

// ---------- Results ----------
function siteCard(cls, name, url, leads, months, nums, take) {
  const max = Math.max(...leads, 1);
  return `<div class="panel sitecard ${cls}"><h2>${name}</h2><div class="note">${url}</div>
    <div class="bars" role="img" aria-label="New leads per month">${leads.map((v, i) => `<div><b>${v}</b><span class="b" style="height:${Math.round((v / max) * 88)}%"></span>${months[i]}</div>`).join('')}</div>
    <div class="note" style="margin-bottom:12px">New leads per month</div>
    <div class="nums">${nums.join('')}</div><ul class="take">${take.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
}
function nb(lbl, v, prev, note) {
  const ch = prev != null ? pctChange(v, prev) : null;
  return `<div class="num-b"><div class="lbl">${esc(lbl)}</div><div class="big">${typeof v === 'number' ? n0(v) : esc(v)}</div>${ch != null ? `<div class="delta">${arrow(ch, 'up')} vs previous 28 days</div>` : note ? `<div class="delta note">${esc(note)}</div>` : ''}</div>`;
}
function resultsView(d) {
  const k = Object.fromEntries(d.kpis.map((x) => [x.label, x]));
  const pk = Object.fromEntries(d.pool.kpis.map((x) => [x.label, x]));
  const L = d.leads;
  return `<p class="lede">Is it working? Leads first, then Google. No paid ads ran.</p><div class="split">
  ${siteCard('', 'The Sauna Company', 'saunacompany.co.uk', L.sauna, L.months, [
    nb('Google clicks', k['Google clicks'].value, k['Google clicks'].prev),
    nb('Google reviews', k['Google reviews'].value, null, 'top competitor: 4.8★ (52)')],
    ['Leads fell to 17 in October, the lowest this year.', 'Clicks are flat: pages show in Google but titles don’t win the click.', 'Fastest wins: Google reviews, and the trade outreach calls.'])}
  ${siteCard('pool', 'Swimming Pool Company', 'swimmingpoolcompany.co.uk', L.pool, L.months, [
    nb('Google clicks', pk['Google clicks'].value, pk['Google clicks'].prev),
    nb('Real UK visitors', pk['Real (UK) visitors'].value, null, 'last 30 days; US visits are bots')],
    ['Google clicks more than doubled, but leads stayed at 2–3 a month.', 'Visitors arrive but don’t enquire: add quote buttons and phone on every page (P1).', 'No commercial pools page yet (P2).'])}
  </div><p class="note">${esc(L.note)}</p>`;
}

// ---------- Details ----------
function wireDetails() {
  document.querySelectorAll('#dsite button').forEach((b) => b.addEventListener('click', () => {
    STATE.dsite = b.dataset.d;
    document.querySelectorAll('#dsite button').forEach((x) => x.setAttribute('aria-pressed', x === b));
    document.querySelectorAll('.dsec').forEach((s) => (s.hidden = s.dataset.d !== b.dataset.d));
  }));
}
function detailsView(d) {
  const acc = (title, html, open) => `<details class="acc"${open ? ' open' : ''}><summary>${title}</summary><div class="in">${html}</div></details>`;
  const p = d.pool;
  const row = (cells) => `<tr>${cells.map((c, i) => `<td${i ? ' class="num"' : ''}>${typeof c === 'number' ? n0(c) : esc(c)}</td>`).join('')}</tr>`;
  const tbl = (head, rows) => `<div class="tablewrap"><table><thead><tr>${head.map((x, i) => `<th${i ? ' class="num"' : ''}>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(row).join('')}</tbody></table></div>`;
  const poolHtmlOld = `<ul class="plain" style="margin-bottom:12px">${p.findings.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>
    <h3 style="font-size:15px;margin:12px 0 6px">Google clicks vs new leads</h3>${tbl(['Month', 'Clicks', 'Impressions', 'New leads'], p.monthly)}
    <h3 style="font-size:15px;margin:12px 0 6px">Top searches (3 months)</h3>${tbl(['Search', 'Clicks', 'Impr.', 'Pos.'], p.queries)}
    <h3 style="font-size:15px;margin:12px 0 6px">Pages (3 months)</h3>${tbl(['Page', 'Clicks', 'Impr.', 'Pos.'], p.pages)}
    <h3 style="font-size:15px;margin:12px 0 6px">Where visitors come from (GA4)</h3>${tbl(['Source', 'Sessions', 'Engaged %'], p.sources)}`;
  const P = d.pulse || {}, W = P.week || {};
  const pk = (W.keywords || []).filter((x) => x.site === 'Pool');
  const pg = (P.gbp || []).find((g) => g.site === 'Pool');
  const pb = (P.blogs || []).find((b) => b.site === 'Pool');
  const ps = (P.socialPosts || []).filter((x) => x.site === 'Pool');
  const poolSecs = [
    acc('Pool: what we found', `<ul class="plain">${p.findings.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>`, true),
    acc('Pool: Google search by month', tbl(['Month', 'Clicks', 'Impressions', 'New leads'], p.monthly)),
    acc('Pool: top searches and pages (3 months)', `<h3 style="font-size:15px;margin:0 0 6px">Searches</h3>${tbl(['Search', 'Clicks', 'Impr.', 'Pos.'], p.queries)}<h3 style="font-size:15px;margin:12px 0 6px">Pages</h3>${tbl(['Page', 'Clicks', 'Impr.', 'Pos.'], p.pages)}`),
    pk.length ? acc('Pool: keywords moving up this week', tbl(['Search', 'UK searches / month', 'Position', 'Before'], pk.map((x) => [x.kw, x.vol, x.pos, x.prev == null ? 'not ranked' : x.prev]))) : '',
    acc('Pool: where visitors come from (GA4)', tbl(['Source', 'Sessions', 'Engaged %'], p.sources)),
    pg ? acc('Pool: Google Business Profile', `<p>${esc(pg.name)}: ${pg.rating}★ from ${pg.reviews} reviews, ${pg.photos} photos, last post ${fmtD(pg.lastPost)} (${pg.posts7} in 7 days). <a href="${esc(pg.url)}" target="_blank" rel="noopener">Open on Google</a></p>`) : '',
    pb ? acc('Pool: blog', `${(pb.recent || []).map((r) => `<div class="li"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a><span class="note">${fmtD(r.date)}${r.issues.length ? ` · ${esc(r.issues.join(', '))}` : ''}</span></div>`).join('')}<p class="note">${pb.scheduled} scheduled.</p>`) : '',
    ps.length ? acc('Pool: social media (30 days)', tbl(['Post', 'Reach', 'Interactions'], ps.map((x) => [`${x.network} · ${x.title}`, x.reach, x.interactions]))) : '',
  ].join('');
  const saunaSecs = [acc('Sauna: Google search, 12 months', search(d)), acc('Sauna: pages that need work', pagesSec(d)), acc('Sauna: keyword gaps', keywords(d)),
    acc('Sauna: competitors', comps(d)), acc('Sauna: Google Business Profile', local(d)), acc('Sauna: blog', content(d)), acc('Sauna: social media', social(d)), acc('Sauna: technical and backlinks', technical(d))].join('');
  const cur = STATE.dsite || 'Sauna';
  return `<p class="lede">The full numbers behind the Results tab. Pick a business, then open a section.</p>
    <div class="chips" id="dsite" role="group" aria-label="Choose business">${['Sauna', 'Pool'].map((k) => `<button data-d="${k}" aria-pressed="${cur === k}">${k === 'Sauna' ? 'The Sauna Company' : 'Swimming Pool Company'}</button>`).join('')}</div>
    <div class="dsec" data-d="Sauna"${cur === 'Sauna' ? '' : ' hidden'}>${saunaSecs}</div>
    <div class="dsec" data-d="Pool"${cur === 'Pool' ? '' : ' hidden'}>${poolSecs}</div>
    <div class="links">${Object.entries(d.meta.links).map(([k2, v]) => `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(k2)}</a>`).join('')}</div>`;
}
